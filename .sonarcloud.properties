# Configuration de l'analyse automatique de SonarCloud, versionnée (Q8, plan-qualite-mvp).
# Les badges du README en dépendent.

# Code de l'application : interface, cœur Rust, scripts.
sonar.sources=src,src-tauri/src,src-tauri/build.rs,scripts
# Tests à part : leur duplication et leurs règles ne pèsent pas sur le code livré.
sonar.tests=tests,e2e,src-tauri/tests
sonar.exclusions=docs/**,dist/**,dist-perf/**,src-tauri/target/**,src-tauri/gen/**,**/fixtures/**
sonar.sourceEncoding=UTF-8
