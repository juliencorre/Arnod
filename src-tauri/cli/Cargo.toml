[package]
name = "arnod-cli"
version = "0.1.0"
description = "Arnod - ligne de commande : arnod run"
authors = ["Julien Corre"]
license = "MIT"
repository = "https://github.com/juliencorre/Arnod"
edition = "2024"
rust-version = "1.90"
publish = false

# Le binaire s'appelle `arnod-cli` dans la cible de Cargo (l'application y a déjà `arnod`) ; il est
# livré sous le nom `arnod` (Windows : `bin\arnod.exe` de l'installeur ; Linux : joint à la
# release), V2 lot D, Q3.
[[bin]]
name = "arnod-cli"
path = "src/main.rs"

[dependencies]
# Le cœur sans le coffre ni la synchronisation : exécutable Linux lié statiquement (musl), sans
# D-Bus (R16).
arnod-core = { path = "../core", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Ailleurs (Windows, Linux glibc), le coffre du système fournit les secrets du poste (R6).
[target.'cfg(not(target_env = "musl"))'.dependencies]
arnod-core = { path = "../core", default-features = false, features = ["coffre"] }

[dev-dependencies]
tempfile = "3"
# Serveur HTTP simulé pour les tests de bout en bout de la commande.
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
