[package]
name = "arnod"
version = "0.0.1"
description = "Arnod - application de test d'API"
authors = ["Julien Corre"]
license = "MIT"
repository = "https://github.com/juliencorre/Arnod"
edition = "2024"
rust-version = "1.90"

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la bibliothèque et le binaire
# sous Windows, voir https://github.com/rust-lang/cargo/issues/8519
name = "arnod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

# Optimisations de taille, voir https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
