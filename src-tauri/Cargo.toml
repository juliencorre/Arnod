[package]
name = "arnod"
version = "0.0.4"
description = "Arnod - application de test d'API"
authors = ["Julien Corre"]
license = "MIT"
repository = "https://github.com/juliencorre/Arnod"
edition = "2024"
rust-version = "1.90"

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la bibliothèque et le binaire
# sous Windows, voir https://github.com/rust-lang/cargo/issues/8519
name = "arnod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Espace de travail (V2, lots C et D) : l'application, son cœur sans Tauri (`core/`,
# `arnod-core`) et la ligne de commande (`cli/`, `arnod-cli`). `cargo test`, `cargo clippy` et
# `cargo build` lancés ici couvrent les trois.
[workspace]
members = ["core", "cli"]
default-members = [".", "core", "cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Cœur sans Tauri (V2, lot C) : modèle, fichiers, envoi (reqwest, rustls), coffre, établi,
# recherche ; ses dépendances sont déclarées dans `core/Cargo.toml`.
arnod-core = { path = "core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# Ordre du document conservé : opérations des contrats, corps des réponses.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Sélecteur de dossier natif, appelé uniquement depuis Rust (aucune permission WebView).
tauri-plugin-dialog = "2"
# Client HTTP du cœur (même version) : contrat téléchargé depuis une adresse (`contract_add`).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Lot L - Mises à jour (docs/plan-mvp-l-mises-a-jour.md, décision Q1). Vérification de la
# signature minisign et installation (NSIS passif, AppImage remplacée), appelées depuis Rust
# seulement : ni paquet npm, ni permission WebView. Arnod télécharge par son propre client (proxy,
# autorités internes) : ni zip ni proxy du système ; `rustls-tls` seulement parce que le plugin ne
# compile pas sans client TLS (même rustls que reqwest 0.12, pas d'OpenSSL).
# Épinglé en 2.14 : `Updater::restore_update` et `Update::verify` y sont apparus.
tauri-plugin-updater = { version = "~2.14", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
# Tests asynchrones (`#[tokio::test]`) ; le runtime de l'application est celui de Tauri.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Lot L : application simulée (`tauri::test`) pour vérifier les signatures par le plugin.
tauri = { version = "2", features = ["test"] }
# Serveur HTTP simulé pour les tests des envois et des runs.
wiremock = "0.6"
# Miroir IPC (MA1, Q2 du plan-qualite-mvp) : types TypeScript engendrés depuis les types Rust, en
# test seulement ; rien n'entre dans l'application.
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }
arnod-core = { path = "core", features = ["ts"] }

# Optimisations de taille, voir https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
