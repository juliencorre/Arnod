[package]
name = "arnod"
version = "0.0.2"
description = "Arnod - application de test d'API"
authors = ["Julien Corre"]
license = "MIT"
repository = "https://github.com/juliencorre/Arnod"
edition = "2024"
rust-version = "1.90"

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la bibliothèque et le binaire
# sous Windows, voir https://github.com/rust-lang/cargo/issues/8519
name = "arnod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# Ordre du document conservé : opérations des contrats, corps des réponses.
serde_json = { version = "1", features = ["preserve_order"] }
# Manifeste arnod.yml des projets (serde_yaml est déprécié).
serde-saphyr = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# Sélecteur de dossier natif, appelé uniquement depuis Rust (aucune permission WebView).
tauri-plugin-dialog = "2"
# Chemins canoniques sans préfixe \\?\ sous Windows.
dunce = "1"
# Client HTTP : TLS rustls (pas d'OpenSSL), appelé uniquement depuis Rust.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Tâches, annulation et concurrence des envois et des runs (déjà tiré par Tauri).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Coffre du système pour les secrets (Windows : gestionnaire d'identification).
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service"] }
# Corbeille du système pour la suppression des dossiers et requêtes.
trash = "5"
# En-tête Authorization Basic.
base64 = "0.23"
# Encodage des paramètres d'adresse et des formulaires.
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
# Serveur HTTP simulé pour les tests des envois et des runs.
wiremock = "0.6"

# Optimisations de taille, voir https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
