<!-- @dsCard group="Statuts" height=110 subtitle="StatusMark" -->
<div class="demo">
  <style>
    .demo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 300px;
      padding: 12px 16px;
      font: var(--text-body) / 1.5 var(--font-sans);
      color: var(--color-text);
      background: var(--color-sidebar);
    }
    .demo__row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .demo__method {
      width: 40px;
      font: 700 11px var(--font-mono);
    }
  </style>
  <div class="demo__row">
    <span class="demo__method" style="color: var(--color-success)">GET</span>
    <span>Lister les produits</span>
    <span class="status-mark status-mark--ok" title="Réussie">
      <span aria-hidden="true">✓</span><span class="visually-hidden">, réussie</span>
    </span>
  </div>
  <div class="demo__row">
    <span class="demo__method" style="color: var(--color-link)">POST</span>
    <span>Créer une commande</span>
    <span class="status-mark status-mark--ko" title="En échec">
      <span aria-hidden="true">✕</span><span class="visually-hidden">, en échec</span>
    </span>
  </div>
  <div class="demo__row">
    <span class="demo__method" style="color: var(--color-danger)">DELETE</span>
    <span>Annuler une commande</span>
  </div>
</div>
