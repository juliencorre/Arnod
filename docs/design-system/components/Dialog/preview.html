<!-- @dsCard group="Menus et fenêtres" height=320 subtitle="BaseDialog" -->
<div class="demo">
  <style>
    .demo {
      padding: 24px 16px;
      font: var(--text-body) / 1.5 var(--font-sans);
      color: var(--color-text);
      background: var(--backdrop);
    }
    .demo .dialog {
      position: static;
      display: block;
      margin: 0 auto;
    }
    .demo__field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: var(--text-small);
      color: var(--color-muted);
    }
  </style>
  <dialog open class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <div class="dialog__panel">
      <h2 id="dialog-title" class="dialog__title">Nouveau projet</h2>
      <p id="dialog-description" class="dialog__description">
        Un projet est un dossier, à ranger dans Git.
      </p>
      <div class="dialog__body">
        <label class="demo__field" for="project-name">
          Nom
          <input id="project-name" class="search" type="text" value="boutique-tests" />
        </label>
      </div>
      <footer class="dialog__footer">
        <button type="button" class="button button--secondary">Annuler</button>
        <button type="button" class="button button--primary">Créer</button>
      </footer>
    </div>
  </dialog>
</div>
