# État de chaque écran de la maquette par rapport au code.
#
# Source des pastilles, des fiches et de l'index de la maquette (page 0.1). Une pull request qui
# livre, modifie ou écarte un écran met ce fichier à jour ; scripts/check-maquette.mjs le vérifie
# (npm run check et CI). Règles : docs/plan-suivi-maquette.md.
#
# Repère d'écran : <code de page>-<lettre>, par exemple 3.2-a2. États : livré, en partie,
# à faire, variante, remplacé, à décider (référence pour les pages de cadre). Un écart dit en quoi
# le code diffère de l'écran et quoi aligner : la maquette, le code, ou « à décider ».
version: 1
transverses:
  - texte: "Barre de titre : les écrans dessinent une barre intégrée (logo, sélecteur de workspace, boutons de fenêtre) ; l'application garde la barre du système et place le sélecteur en tête de la barre latérale (plan-selecteur-workspace)."
    aligner: maquette
  - texte: "Environnement : l'application crée « Local » dans chaque projet et dans Non classés ; plusieurs écrans montrent « Aucun environnement » (1.2-d, 2.2-a)."
    aligner: maquette
  - texte: "Couleurs : les écrans écrivent encore des teintes hors du design system (texte moyen #3a3732 et #4a463f, bordures #ddd6cb, bleus des contrats) ; le bouton principal et les teintes presque identiques sont alignés (scripts/maquette-couleurs.py). 0.5-e liste ce qui reste, avec le jeton le plus proche."
    aligner: maquette
    page: "0.5"
  - texte: "Tailles et rayons : quelques écrans dessinent encore des tailles (10,5, 12,5, 14, 17 px) et des rayons (3, 4, 5, 7, 8, 9 px) hors de l'échelle du design system, que le code applique (1.2-a, 4.2-a)."
    aligner: maquette
    page: "0.5"
  - texte: "Espacements : le design system décrit les pas employés (space-2 à space-32), sans variables dans le code ni règle dans la maquette."
    aligner: à décider
    page: "0.5"
  - texte: "Bords de contrôle : cases à cocher, interrupteurs, boutons radio et anneau de focus prennent un jeton --color-border-control à 3:1 (#8f8a83 en clair, #7d7871 en sombre) ; les champs gardent --color-border. Le code dessine cases et interrupteur éteint en --color-border-strong (1,65:1) ou --color-border (1,19:1) et le focus de la poignée de séparation en accent (2,28:1) (DE4, AC5 ; Q10 du plan-qualite-mvp)."
    aligner: code
    page: "0.5"
  - texte: "Couleurs de texte : --color-accent-text seulement sur un fond accent, --color-subtle seulement pour les indications ; le code les emploie sur du texte à lire (1.6-g, 4.1-g et 4.2-c en thème sombre ; aide du filtre et en-têtes ajoutés à 3,3:1) (DE2, AC6)."
    aligner: code
    page: "0.5"
  - texte: "Formes uniques : un compteur en pastille, la sélection en fond --color-accent-soft, l'ajout d'une ligne en bouton « + Nom », le retrait par × ; le code mêle « (1) », point « • », soulignement et plein noir, liens et pointillés, « ✕ Supprimer » et « Retirer » (DE7, ER8)."
    aligner: code
    page: "0.5"
  - texte: "Suppressions : toute suppression se rattrape par « Annuler » dans sa notification, et une notification d'erreur reste jusqu'à sa fermeture ; le code supprime sans annulation un dossier ou un test, un contrat, un environnement, et efface les erreurs après 6 s (ER1, ER7)."
    aligner: code
  - texte: "Clavier et cibles : l'arbre se parcourt aux flèches (Début, Fin, F2, Suppr, Maj+F10), les onglets de l'éditeur et de la réponse aussi ; toute cible fait 24 px au moins ; le focus revient au déclencheur après une fermeture ; le code n'a ni flèches dans l'arbre ni dans ces onglets, a des cibles de 11 à 23 px et perd le focus après plusieurs actions (AC1 à AC4)."
    aligner: code
