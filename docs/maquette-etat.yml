# État de chaque écran de la maquette par rapport au code.
#
# Source des pastilles, des fiches et de l'index de la maquette (page 0.1). Une pull request qui
# livre, modifie ou écarte un écran met ce fichier à jour ; scripts/check-maquette.mjs le vérifie
# (npm run check et CI). Règles : docs/plan-suivi-maquette.md.
#
# Repère d'écran : <code de page>-<lettre>, par exemple 3.2-a2. États : livré, en partie,
# à faire, variante, remplacé, à décider (référence pour les pages de cadre). Un écart dit en quoi
# le code diffère de l'écran et quoi aligner : la maquette, le code, ou « à décider ».
version: 1
transverses:
  - texte: "Barre de titre : les écrans dessinent une barre intégrée (logo, sélecteur de workspace, boutons de fenêtre) ; l'application garde la barre du système et place le sélecteur en tête de la barre latérale (plan-selecteur-workspace)."
    aligner: maquette
  - texte: "Barre d'état : présente sur tous les écrans (mocks actifs, catalogue, modifications à envoyer, partage) ; absente de l'application."
    aligner: code
  - texte: "Vocabulaire : les écrans parlent de « test » et d'« assertion » ; l'application de « requête » et de « vérification » (0.2 : une requête est une étape d'un test)."
    aligner: maquette
  - texte: "Environnement : l'application crée « Local » dans chaque projet et dans Non classés ; plusieurs écrans montrent « Aucun environnement » (1.2-d, 2.2-a)."
    aligner: maquette
  - texte: "Couleurs : les écrans écrivent encore des teintes hors du design system (texte moyen #3a3732 et #4a463f, bordures #ddd6cb, bleus des contrats) ; le bouton principal et les teintes presque identiques sont alignés (scripts/maquette-couleurs.py). 0.5-e liste ce qui reste, avec le jeton le plus proche."
    aligner: maquette
    page: "0.5"
  - texte: "Tailles et rayons : quelques écrans dessinent encore des tailles (10,5, 12,5, 14, 17 px) et des rayons (3, 4, 5, 7, 8, 9 px) hors de l'échelle du design system, que le code applique (1.2-a, 4.2-a)."
    aligner: maquette
    page: "0.5"
  - texte: "Espacements : le design system décrit les pas employés (space-2 à space-32), sans variables dans le code ni règle dans la maquette."
    aligner: à décider
    page: "0.5"
