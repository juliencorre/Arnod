      - "2026-11-17 : Redessiné selon plan-qualite-mvp (maquette de référence) : b : réponse vide et envoi en cours en texte secondaire neutre, erreur d'envoi avec son action (« Ajouter », « Environnements… »), vue partagée à 1280 px sur une ligne (DE1, DE3, ER6) ; h : barre des étapes sur une rangée qui défile (DE8) ; compteurs en pastille, sélection en fond accent doux, interrupteur éteint au bord de contrôle (DE4, DE7)."
      - "2026-11-26 : Comparée à l'application (captures e2e et aperçu du 26 novembre) : 8 écarts ajoutés, 2 réécrits ou complétés."
      - "2026-11-26 : c : la note cite l'assertion de durée telle qu'écrite (plan-alignement-maquette, lot A, AM12)."
      - "2026-11-26 : b, h : réponse vide en texte neutre, éditeur à 58 % et onglets sur une ligne à 1280 px, compteurs en pastille ; barre des étapes sur une rangée (plan-qualite-mvp, lot I, DE1, DE3, DE7, DE8)."
    ecrans:
      a:
        etat: livré
        pr: [27]
        ecart:
          texte: "Pendant l'envoi, « Annuler » remplace « Envoyer » et « Envoi en cours… » s'affiche, mais sans le temps écoulé (« 0,8 s »), ni les onglets et la chronologie en direct, ni les notes « La requête est partie… » et « Les assertions seront évaluées dès la réponse reçue »."
          aligner: à décider
      b:
        etat: livré
        pr: [27, 42]
        captures: [19-verification-en-echec]
        ecart:
          - texte: "Une erreur d'envoi propose son action (« Ajouter », « Environnements… ») ; le code montre l'erreur seule (ER6) (plan-qualite-mvp, maquette de référence)."
            aligner: code
          - texte: "Ligne d'état : statut en texte simple, sans l'environnement ; la maquette met « 201 Created » en pastille verte et l'environnement à droite, comme le code le fait déjà sur un échec réseau (5.1-i) (aussi 5.1-b bis à 5.1-h)."
            aligner: code
          - texte: "Verdict « Réussie » ou « Échec · N assertion(s) » et onglet « Assertions (N) » ; la maquette écrit « Assertions 4/5 » (avec DE10)."
            aligner: à décider
          - texte: "L'éditeur montre Nom, Description et Étiquettes, les onglets Docs et Réglages, la méthode à part, chaque en-tête sur deux rangées (avec sa description) et la rangée « Réponses attendues » (EP1, EP4, EP8) ; la maquette met le nom en titre et la méthode dans le champ d'adresse."
            aligner: maquette
      "b bis":
        etat: livré
        version: MVP
        pr: [47, 51, 65]
        captures: [a1-reponse-filtre, a2-reponse-apercu-html]
        ecart:
          - texte: "« + Assertion » porte sur la correspondance courante (body.items[0].sku égal à …, ↑ ↓ ou Entrée pour changer) au lieu de body.items[*].sku contient … : une assertion ne lit pas de joker ; l'interrupteur « Aperçu » ne rend qu'un corps HTML ; « Extraire dans une variable » range la correspondance courante dans une extraction (lot E, PR #51)."
            aligner: maquette
          - texte: "Le filtre JSONPath est juste sous le corps ; la maquette l'ancre en bas du panneau."
            aligner: à décider
      "b ter":
        {
          etat: livré,
          version: MVP,
          pr: [49],
          captures: [22-variable-inconnue],
          ecart:
            {
              texte: "Le nom inconnu est souligné sans être écrit en rouge (un champ ne colore pas une partie de son texte) ; l'Authorization de l'onglet Auth est listée dans « Ajoutés à l'envoi » avec sa source, pas dans « Hérités » ; Accept-Encoding n'est pas listé : le client HTTP ne demande pas de compression.",
              aligner: maquette,
            },
        }
      "b quater":
        {
          etat: livré,
          version: MVP,
          pr: [49],
          captures: [23-en-tetes-en-texte],
          ecart:
            {
              texte: "« Copier » de la fenêtre cURL est un bouton secondaire (un seul bouton plein par vue : « Envoyer ») ; la ligne illisible est marquée dans la gouttière, pas surlignée ; pas encore de liste de variables à éditer en texte (onglet Variables du lot E).",
              aligner: maquette,
            },
        }
      c:
        etat: livré
        pr: [27, 65]
        captures: [34-chronologie]
        ecart:
          - texte: "TCP et TLS forment une seule ligne « Connexion et TLS » : le client HTTP ne les mesure pas à part ; une connexion reprise du pool n'a ni DNS ni connexion, ce qui est dit sous le total. « Attente du serveur » au lieu d'« Attente »."
            aligner: maquette
          - texte: "Barre d'attente à la couleur d'accent ; la maquette la dessine en sarcelle."
            aligner: à décider
      "c bis": { etat: à faire, version: V1 }
      h:
        etat: livré
        version: MVP
        pr: [51, 55]
        captures: [25-valeurs-dynamiques]
        ecart:
          - texte: "« Envoyé » montre aussi les variables utilisées, les valeurs extraites et les en-têtes envoyés ; la liste s'ouvre au-dessus du curseur quand la place manque dessous ; « $date » (date du jour) et « $date:+3d » (décalée) sont deux lignes de la liste."
            aligner: maquette
          - texte: "Onglet Envoyé : corps envoyé en texte brut, sans les valeurs tirées surlignées, sans titre « URL résolue » ni note « Exactement ce qui est parti… », en-têtes après les variables ; la source dit « environnement » ou « extraite » au lieu du nom de l'environnement ou de « locale »."
            aligner: code
      i:
        etat: livré
        version: MVP
        pr: [58]
        captures: [h2-echec-reseau]
        ecart:
          texte: "« Faire confiance… » est un bouton secondaire (un seul bouton plein par vue : « Envoyer ») et ouvre les préférences sur l'autorité à confirmer ; pas d'onglets Erreur, Envoyé, Chronologie pour un échec ; « Utiliser mon compte Windows » (407) attend l'identification Windows (V3). La note renvoie à « Préférences → Réseau et certificats », nom de la section, au lieu de « Préférences → Certificats »."
          aligner: maquette
