            aligner: code
          - texte: "« run #3 » et « en même temps » (RU1)."
            aligner: maquette
          - texte: "En cours (d'après le code, sans capture) : « Annuler » au lieu d'« Arrêter », « En cours · 17/28 » au lieu de « 17 / 28 · 2 en échec · 2,1 s », sans « Les échecs remontent en tête… » ni « L'exécution continue si vous allez ailleurs… »."
