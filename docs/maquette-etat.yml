      b:
        etat: livré
        pr: [27, 42]
        captures: [19-verification-en-echec]
        ecart:
          texte: "Panneau de réponse vide ou en attente en texte secondaire neutre ; vue partagée à 1280 × 775 avec une adresse lisible et les onglets de l'éditeur et du résultat sur une ligne ; une erreur d'envoi propose son action. Le code écrit « Envoyez la requête pour voir la réponse. » et « Envoi en cours… » en rouge d'erreur, laisse 274 px à l'adresse et passe les onglets sur deux rangées, et montre l'erreur seule (DE1, DE3, ER6) (plan-qualite-mvp, maquette de référence)."
          aligner: code
      "b bis":
        {
          etat: livré,
          version: MVP,
          pr: [47, 51, 65],
          captures: [a1-reponse-filtre, a2-reponse-apercu-html],
          ecart:
            {
              texte: "« + Assertion » porte sur la correspondance courante (body.items[0].sku égal à …, ↑ ↓ ou Entrée pour changer) au lieu de body.items[*].sku contient … : une assertion ne lit pas de joker ; l'interrupteur « Aperçu » ne rend qu'un corps HTML ; « Extraire dans une variable » range la correspondance courante dans une extraction (lot E, PR #51).",
              aligner: maquette,
            },
        }
      "b ter":
        {
          etat: livré,
          version: MVP,
          pr: [49],
          captures: [22-variable-inconnue],
          ecart:
            {
              texte: "Le nom inconnu est souligné sans être écrit en rouge (un champ ne colore pas une partie de son texte) ; l'Authorization de l'onglet Auth est listée dans « Ajoutés à l'envoi » avec sa source, pas dans « Hérités » ; Accept-Encoding n'est pas listé : le client HTTP ne demande pas de compression.",
              aligner: maquette,
            },
        }
      "b quater":
        {
          etat: livré,
          version: MVP,
          pr: [49],
          captures: [23-en-tetes-en-texte],
          ecart:
            {
              texte: "« Copier » de la fenêtre cURL est un bouton secondaire (un seul bouton plein par vue : « Envoyer ») ; la ligne illisible est marquée dans la gouttière, pas surlignée ; pas encore de liste de variables à éditer en texte (onglet Variables du lot E).",
              aligner: maquette,
            },
        }
      c:
        {
          etat: livré,
          pr: [27, 65],
          captures: [34-chronologie],
          ecart:
            {
              texte: "TCP et TLS forment une seule ligne « Connexion et TLS » : le client HTTP ne les mesure pas à part ; une connexion reprise du pool n'a ni DNS ni connexion, ce qui est dit sous le total.",
              aligner: maquette,
            },
        }
      "c bis": { etat: à faire, version: V1 }
      h:
        etat: livré
        version: MVP
        pr: [51, 55]
        captures: [25-valeurs-dynamiques]
        ecart:
          - texte: "« Envoyé » montre aussi les variables utilisées, les valeurs extraites et les en-têtes envoyés ; la liste s'ouvre au-dessus du curseur quand la place manque dessous ; « $date » (date du jour) et « $date:+3d » (décalée) sont deux lignes de la liste."
            aligner: maquette
          - texte: "Barre des étapes sur une rangée qui défile ; le code passe sur deux ou trois rangées et repousse le corps vers le bas (DE8) (plan-qualite-mvp, maquette de référence)."
            aligner: code
      i:
        {
          etat: livré,
          version: MVP,
          pr: [58],
          captures: [h2-echec-reseau],
          ecart:
            {
