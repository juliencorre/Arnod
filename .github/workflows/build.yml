name: build

on:
  push:
    branches: [main, Develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint et format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: npm ci
      - name: Versions concordantes
        run: node scripts/check-version.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS)
            os: windows-latest
            bundle: nsis
            # N3 : installeur inférieur à 15 Mo.
            max-mb: 15
            artifact: arnod-windows-nsis
            path: src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: Linux (AppImage)
            # Ubuntu 22.04 : glibc minimale visée par N6.
            os: ubuntu-22.04
            bundle: appimage
            artifact: arnod-linux-appimage
            path: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf file \
            xvfb xdotool imagemagick

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Tests frontend (Vitest)
        run: npm test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: tauri build
        run: npm run tauri build

      - name: Taille du paquet
        run: node scripts/bundle-size.mjs ${{ matrix.bundle }} ${{ matrix.max-mb && format('--max-mb {0}', matrix.max-mb) || '' }}

      # Publié avant les tests de fumée : le paquet reste téléchargeable s'ils échouent.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      - name: Test de fumée (AppImage sous Xvfb)
        if: runner.os == 'Linux'
        run: scripts/smoke-linux.sh "$(ls ${{ matrix.path }} | head -n 1)" smoke-linux.png

      - name: Test de fumée (installation silencieuse sans élévation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-windows.ps1 -Installer (Get-Item "${{ matrix.path }}" | Select-Object -First 1).FullName -Screenshot smoke-windows.png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots-${{ matrix.bundle }}
          path: smoke-*.png
          if-no-files-found: ignore

  e2e:
    name: E2E (Linux, application réelle)
    # Parcours complets sur le binaire debug via tauri-driver et WebKitWebDriver,
    # sous Xvfb, en thème clair puis sombre. Voir e2e/README.md.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev file \
            webkit2gtk-driver xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build debug de l'application
        run: npm run build:e2e

      - name: Tests e2e (thème clair)
        run: xvfb-run -a npm run test:e2e

      - name: Tests e2e (thème sombre)
        run: xvfb-run -a npm run test:e2e
        env:
          ARNOD_E2E_THEME: dark

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-captures
          path: e2e/artifacts/*.png
          if-no-files-found: ignore

  release:
    name: Release GitHub
    needs: [lint, build, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier que le tag correspond à la version
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v7
        with:
          pattern: arnod-*
          path: dist
          merge-multiple: true

      - name: Créer la release ou y ajouter les paquets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # Release déjà créée (à la main ou par une exécution précédente) : on y ajoute les
          # paquets au lieu d'échouer.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "Arnod ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
