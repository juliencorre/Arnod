name: pr-title

# Le titre d'une pull request devient le message du commit sur main et alimente les notes de
# release : il doit suivre les Conventional Commits (feat: …, fix: …, docs: …).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-commits:
    name: Titre en Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le titre
        env:
          # Passé par l'environnement : le titre n'est jamais interprété par le shell.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          # Préfixe en début de ligne : le titre ne peut pas être lu comme une commande de workflow.
          echo "Titre : $TITLE"
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=Titre de pull request::Le titre ne suit pas les Conventional Commits. Exemples : « feat: gestion des workspaces (lot F) », « fix: … », « docs: … »."
            exit 1
          fi
